<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Discovery Service - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>
        <div class="admin-content" id="main-content">
            <div class="flex justify-between items-center mb-6">
                <h1 class="heading-md mb-0"><i class="me-2" data-icon="square-pen" aria-hidden="true"></i>Edit Discovery Service</h1>
                <a class="ui-btn ui-btn-outline-secondary" th:href="@{/admin/resource-discovery}">
                    <i class="me-1" data-icon="arrow-left" aria-hidden="true"></i>Back
                </a>
            </div>

            <div class="ui-card">
                <div class="ui-card-body">
                    <form th:action="@{/admin/resource-discovery/edit/{id}(id=${discovery.id})}" method="post">
                        <div class="mb-4">
                            <label class="ui-form-label">Name</label>
                            <input type="text" class="ui-form-control" name="name" required maxlength="255" th:value="${discovery.name}">
                        </div>
                        <div class="mb-4">
                            <label class="ui-form-label">Type</label>
                            <select class="ui-form-select" name="type" required>
                                <option th:each="type : ${discoveryServiceTypes}"
                                        th:value="${type}"
                                        th:selected="${discovery.type == type}"
                                        th:text="${type}">TYPE</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="ui-form-label">Target</label>
                            <input type="text" class="ui-form-control" name="target" required maxlength="1000" th:value="${discovery.target}">
                            <div class="ui-form-text">Registry namespace, for example ghcr.io/owner or registry.example.com/team.</div>
                        </div>
                        <div class="ui-form-check mb-4">
                            <input class="ui-form-check-input" type="checkbox" id="skipTLS" name="skipTLS" value="true"
                                   th:checked="${discovery.skipTls}">
                            <label class="ui-form-check-label" for="skipTLS">Ignore TLS certificate and hostname errors</label>
                        </div>
                        <div class="ui-form-check mb-4">
                            <input class="ui-form-check-input" type="checkbox" id="recursive" name="recursive" value="true"
                                   th:checked="${discovery.recursive}">
                            <label class="ui-form-check-label" for="recursive">Recursive discovery</label>
                        </div>
                        <div class="ui-form-check mb-4">
                            <input class="ui-form-check-input" type="checkbox" id="onlyTaggedResources" name="onlyTaggedResources" value="true"
                                   th:checked="${discovery.onlyTaggedResources}">
                            <label class="ui-form-check-label" for="onlyTaggedResources">Only scrape tagged resources
                                <small class="text-muted block">When enabled, only OpenShift routes with annotation <code>kairos.wenisch.tech/scrape: "true"</code> are discovered.</small>
                            </label>
                        </div>
                        <div class="ui-form-check mb-4">
                            <input class="ui-form-check-input" type="checkbox" id="latestTagOnly" name="latestTagOnly" value="true"
                                   th:checked="${discovery.latestTagOnly}">
                            <label class="ui-form-check-label" for="latestTagOnly">Only discover 'latest' tag
                                <small class="text-muted block">When enabled, only the Docker image tag <code>latest</code> is discovered; all other tags are ignored.</small>
                            </label>
                        </div>
                        <div class="ui-form-check mb-6">
                            <input class="ui-form-check-input" type="checkbox" id="active" name="active" value="true"
                                   th:checked="${discovery.active}">
                            <label class="ui-form-check-label" for="active">Active</label>
                        </div>

                        <div class="flex gap-2">
                            <button type="submit" class="ui-btn ui-btn-primary">
                                <i class="me-1" data-icon="save" aria-hidden="true"></i>Save Changes
                            </button>
                            <a class="ui-btn ui-btn-outline-secondary" th:href="@{/admin/resource-discovery}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/kairos.js}"></script>
</body>
</html>
