<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resource - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>

        <div class="admin-content" id="main-content">
            <div class="flex justify-between items-center mb-6">
                <h1 class="heading-md mb-0"><i class="me-2" data-icon="square-pen" aria-hidden="true"></i>Edit Resource</h1>
                <a class="ui-btn ui-btn-outline-secondary" th:href="@{/admin/resources}">
                    <i class="me-1" data-icon="arrow-left" aria-hidden="true"></i>Back
                </a>
            </div>

            <div class="ui-card">
                <div class="ui-card-body">
                    <form th:action="@{/admin/resources/edit/{id}(id=${resource.id})}" method="post"
                          x-data="{ resourceType: '' }" x-init="resourceType = $refs.resourceType.value">
                        <div class="mb-4">
                            <label class="ui-form-label">Name</label>
                            <input type="text" class="ui-form-control" name="name" required maxlength="255" th:value="${resource.name}">
                        </div>

                        <div class="mb-4">
                            <label class="ui-form-label">Type</label>
                            <select class="ui-form-select" name="resourceType" required
                                    x-ref="resourceType" x-model="resourceType">
                                <option th:each="type : ${resourceTypes}"
                                        th:value="${type}"
                                        th:selected="${resource.resourceType == type}"
                                        th:text="${type}">TYPE</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="ui-form-label">Target</label>
                            <input type="text" class="ui-form-control" name="target" required maxlength="1000" th:value="${resource.target}">
                            <div class="ui-form-text">URL or Docker image name.</div>
                        </div>

                        <div class="mb-4">
                            <label class="ui-form-label">Groups</label>
                            <select class="ui-form-select" name="groupIds" multiple size="5">
                                <option th:each="group : ${resourceGroups}"
                                        th:value="${group.id}"
                                        th:selected="${resource.groups != null and #lists.contains(resource.groups.![id], group.id)}"
                                        th:text="${group.name}">Group</option>
                            </select>
                            <div class="ui-form-text">Hold Ctrl/⌘ to select multiple groups. Deselect all to leave ungrouped.</div>
                        </div>

                        <div class="mb-4">
                            <label class="ui-form-label">Order</label>
                            <input type="number" class="ui-form-control" name="displayOrder" step="1" th:value="${resource.displayOrder}">
                            <div class="ui-form-text">Lower numbers are shown first.</div>
                        </div>

                        <div class="ui-form-check mb-6">
                            <input class="ui-form-check-input" type="checkbox" id="skipTLS" name="skipTLS" value="true"
                                   th:checked="${resource.skipTls}">
                            <label class="ui-form-check-label" for="skipTLS">
                                Ignore TLS certificate and hostname errors
                            </label>
                            <div class="ui-form-text">Used for HTTPS connections (HTTP checks and Docker registry checks).</div>
                        </div>

                        <div class="ui-form-check mb-6" x-show="resourceType === 'DOCKER'" x-cloak>
                            <input class="ui-form-check-input" type="checkbox" id="recursive" name="recursive" value="true"
                                   th:checked="${resource.recursive}" :disabled="resourceType !== 'DOCKER'">
                            <label class="ui-form-check-label" for="recursive">
                                Recursive
                            </label>
                            <div class="ui-form-text">Includes nested Docker repositories below the configured prefix.</div>
                        </div>

                        <div class="flex gap-2">
                            <button type="submit" class="ui-btn ui-btn-primary">
                                <i class="me-1" data-icon="save" aria-hidden="true"></i>Save Changes
                            </button>
                            <a class="ui-btn ui-btn-outline-secondary" th:href="@{/admin/resources}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/kairos.js}"></script>
</body>
</html>
