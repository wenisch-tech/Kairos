<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>
        <div class="admin-content" id="main-content">
            <th:block th:replace="~{layout :: feedback}"></th:block>

            <div class="flex justify-between items-center mb-6">
                <h1 class="heading-md mb-0"><i class="me-2" data-icon="users" aria-hidden="true"></i>User Management</h1>
                <button class="ui-btn ui-btn-primary" data-ui-toggle="modal" data-ui-target="#addUserModal">
                    <i class="me-1" data-icon="user-plus" aria-hidden="true"></i>Add User
                </button>
            </div>

            <div class="ui-card">
                <div class="ui-card-body p-0">
                    <div class="ui-table-responsive"><table class="ui-table ui-table-hover mb-0">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Provider</th>
                                <th>Last Login</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}" x-data="{ passwordOpen: false }">
                                <td th:text="${user.email}">email</td>
                                <td>
                                    <div class="flex flex-col gap-2">
                                        <span th:class="'ui-badge align-self-start' + (${user.role.name == 'ADMIN'} ? 'tone-warning text-ink' : 'tone-primary')"
                                              th:text="${user.role}">ROLE</span>
                                        <form th:action="@{/admin/users/update-role/{id}(id=${user.id})}" method="post"
                                              class="flex gap-2 items-center flex-wrap">
                                            <select class="ui-form-select ui-form-select-sm" name="role" style="max-width: 160px;">
                                                <option th:each="roleOption : ${userRoles}"
                                                        th:value="${roleOption.name()}"
                                                        th:text="${roleOption.name()}"
                                                        th:selected="${user.role == roleOption}">ROLE</option>
                                            </select>
                                            <button type="submit" class="ui-btn ui-btn-outline-primary ui-btn-sm">
                                                <i class="me-1" data-icon="save" aria-hidden="true"></i>Save
                                            </button>
                                        </form>
                                    </div>
                                </td>
                                <td>
                                    <span th:class="'ui-badge' + (${user.provider.name == 'OIDC'} ? 'tone-info text-ink' : 'tone-secondary')"
                                          th:text="${user.provider}">PROVIDER</span>
                                </td>
                                <td th:text="${user.lastLoginAt != null} ? ${@kairosTime.format(user.lastLoginAt, 'yyyy-MM-dd HH:mm')} : 'Never'">date</td>
                                <td th:text="${user.createdAt != null} ? ${@kairosTime.format(user.createdAt, 'yyyy-MM-dd')} : '-'">date</td>
                                <td>
                                    <div class="flex flex-col items-start gap-2">
                                        <button th:if="${user.provider.name() == 'LOCAL'}" type="button"
                                                class="ui-btn ui-btn-secondary ui-btn-sm"
                                                @click="passwordOpen = !passwordOpen" :aria-expanded="passwordOpen">
                                            <i data-icon="key-round" aria-hidden="true"></i>Change password
                                        </button>
                                        <span th:if="${user.provider.name() == 'OIDC'}" class="text-muted text-sm">
                                            Password managed by identity provider
                                        </span>
                                        <form th:if="${user.provider.name() == 'LOCAL'}"
                                              th:action="@{/admin/users/update-password/{id}(id=${user.id})}" method="post"
                                              class="w-full mt-2" x-show="passwordOpen" x-cloak
                                              x-data="{ password: '', confirmation: '' }">
                                            <div class="mb-2">
                                                <label class="ui-form-label" th:for="'password-' + ${user.id}">New password</label>
                                                <input class="ui-form-control" type="password" name="password"
                                                       th:id="'password-' + ${user.id}" minlength="8" maxlength="200"
                                                       autocomplete="new-password" required x-model="password">
                                            </div>
                                            <div class="mb-2">
                                                <label class="ui-form-label" th:for="'password-confirmation-' + ${user.id}">Confirm password</label>
                                                <input class="ui-form-control" type="password" name="passwordConfirmation"
                                                       th:id="'password-confirmation-' + ${user.id}" minlength="8" maxlength="200"
                                                       autocomplete="new-password" required x-model="confirmation">
                                            </div>
                                            <p class="text-danger text-sm mb-2" x-show="confirmation && password !== confirmation" x-cloak>
                                                The passwords do not match.
                                            </p>
                                            <div class="flex gap-2">
                                                <button type="submit" class="ui-btn ui-btn-primary ui-btn-sm"
                                                        :disabled="password.length < 8 || password !== confirmation">Save password</button>
                                                <button type="button" class="ui-btn ui-btn-secondary ui-btn-sm"
                                                        @click="passwordOpen = false; password = ''; confirmation = ''">Cancel</button>
                                            </div>
                                        </form>
                                        <form th:action="@{/admin/users/delete/{id}(id=${user.id})}" method="post" class="inline"
                                              onsubmit="return confirm('Delete this user?')">
                                            <button type="submit" class="ui-btn ui-btn-danger ui-btn-sm" aria-label="Delete">
                                                <i class="" data-icon="trash-2" aria-hidden="true"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add User Modal -->
<div class="ui-modal" id="addUserModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="addUserModalTitle" x-data="dialog" x-show="open" x-cloak x-trap.inert.noscroll="open" @keydown.escape.window="hide()" @click.self="hide()" @kairos-dialog.window="if ($event.detail.id === $el.id) open = $event.detail.open">
    <div class="ui-modal-dialog">
        <div class="ui-modal-content">
            <div class="ui-modal-header">
                <h5 class="ui-modal-title" id="addUserModalTitle"><i class="me-2" data-icon="user-plus" aria-hidden="true"></i>Add Local User</h5>
                <button type="button" class="ui-btn-close" data-ui-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/admin/users/add}" method="post">
                <div class="ui-modal-body">
                    <div class="mb-4">
                        <label class="ui-form-label">Email</label>
                        <input type="email" class="ui-form-control" name="email" required>
                    </div>
                    <div class="mb-4">
                        <label class="ui-form-label">Password</label>
                        <input type="password" class="ui-form-control" name="password" minlength="8" maxlength="200"
                               autocomplete="new-password" required>
                    </div>
                    <div class="mb-4">
                        <label class="ui-form-label">Role</label>
                        <select class="ui-form-select" name="role">
                            <option value="USER">USER</option>
                            <option value="ADMIN">ADMIN</option>
                        </select>
                    </div>
                </div>
                <div class="ui-modal-footer">
                    <button type="button" class="ui-btn ui-btn-secondary" data-ui-dismiss="modal">Cancel</button>
                    <button type="submit" class="ui-btn ui-btn-primary"><i class="me-1" data-icon="user-plus" aria-hidden="true"></i>Add User</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/kairos.js}"></script>
</body>
</html>
