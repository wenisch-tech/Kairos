<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Types - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>
        <div class="admin-content" id="main-content">
            <div th:if="${successMessage}" class="ui-alert ui-alert-success ui-alert-dismissible is-open">
                <span th:text="${successMessage}">Success</span>
                <button type="button" class="ui-btn-close" data-ui-dismiss="alert" aria-label="Close"></button>
            </div>

            <h1 class="heading-md mb-6"><i class="me-2" data-icon="grid-3x3" aria-hidden="true"></i>Resource Type Configuration</h1>

            <div th:each="config : ${configs}" class="ui-card mb-4">
                <div class="ui-card-header">
                    <strong th:text="${config.typeName}">TYPE</strong>
                </div>
                <div class="ui-card-body">
                    <form th:action="@{/admin/resource-types/update}" method="post">
                        <input type="hidden" name="id" th:value="${config.id}">
                        <div class="ui-grid gap-4">
                            <div class="md:col-span-3">
                                <label class="ui-form-label">Check Interval (minutes)</label>
                                <input type="number" class="ui-form-control" name="checkIntervalMinutes"
                                       th:value="${config.checkIntervalMinutes}" min="1" required>
                            </div>
                            <div class="md:col-span-3">
                                <label class="ui-form-label">Parallelism (threads)</label>
                                <input type="number" class="ui-form-control" name="parallelism"
                                       th:value="${config.parallelism}" min="1" max="20" required>
                            </div>
                            <div class="md:col-span-2">
                                <label class="ui-form-label" title="Number of consecutive failed checks before an outage is opened">Outage Threshold</label>
                                <input type="number" class="ui-form-control" name="outageThreshold"
                                       th:value="${config.outageThreshold}" min="1" required>
                                <div class="ui-form-text">Failed checks to open outage</div>
                            </div>
                            <div class="md:col-span-2">
                                <label class="ui-form-label" title="Number of consecutive successful checks before an active outage is closed">Recovery Threshold</label>
                                <input type="number" class="ui-form-control" name="recoveryThreshold"
                                       th:value="${config.recoveryThreshold}" min="1" required>
                                <div class="ui-form-text">Successful checks to close outage</div>
                            </div>
                            <div class="md:col-span-2 flex items-end">
                                <button type="submit" class="ui-btn ui-btn-primary">
                                    <i class="me-1" data-icon="save" aria-hidden="true"></i>Update
                                </button>
                            </div>
                        </div>
                    </form>

                    <!-- Authentication credentials section -->
                    <hr class="my-4">
                    <h6 class="mb-4"><i class="me-2" data-icon="shield-check" aria-hidden="true"></i>Authentication Credentials</h6>

                    <!-- Existing auths table -->
                    <div th:if="${#lists.size(config.authentications) > 0}" class="mb-4">
                        <div class="ui-table-responsive"><table class="ui-table ui-table-sm ui-table-bordered align-middle">
                            <thead class="ui-table-dark">
                                <tr>
                                    <th>Name</th>
                                    <th>Type</th>
                                    <th>URL Pattern</th>
                                    <th>Username</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="auth : ${config.authentications}">
                                    <td th:text="${auth.name}"></td>
                                    <td><span class="ui-badge tone-secondary" th:text="${auth.authType}">BASIC</span></td>
                                    <td><code th:text="${auth.urlPattern}"></code></td>
                                    <td th:text="${auth.username}"></td>
                                    <td>
                                        <form th:action="@{'/admin/resource-types/auth/delete/' + ${auth.id}}" method="post" class="inline">
                                            <button type="submit" class="ui-btn ui-btn-danger ui-btn-sm"
                                                    onclick="return confirm('Delete this authentication?')" aria-label="Delete">
                                                <i class="" data-icon="trash-2" aria-hidden="true"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table></div>
                    </div>
                    <p th:if="${#lists.size(config.authentications) == 0}" class="text-muted text-sm">
                        No authentication credentials configured.
                    </p>

                    <!-- Add new auth form -->
                    <button class="ui-btn ui-btn-outline-success ui-btn-sm mb-2"
                            type="button"
                            th:data-ui-target="${'#addAuthCollapse-' + config.id}"
                            data-ui-toggle="collapse">
                        <i class="me-1" data-icon="circle-plus" aria-hidden="true"></i>Add Authentication
                    </button>
                    <div th:id="${'addAuthCollapse-' + config.id}" class="ui-collapse">
                        <div class="ui-card ui-card-body surface-subtle mt-2">
                            <form th:action="@{'/admin/resource-types/' + ${config.id} + '/auth/add'}" method="post">
                                <div class="ui-grid gap-2">
                                    <div class="md:col-span-3">
                                        <label class="ui-form-label">Name</label>
                                        <input type="text" class="ui-form-control ui-form-control-sm" name="name"
                                               placeholder="e.g. My Registry" required>
                                    </div>
                                    <div class="md:col-span-3">
                                        <label class="ui-form-label">URL / Target Pattern</label>
                                        <input type="text" class="ui-form-control ui-form-control-sm" name="urlPattern"
                                               placeholder="e.g. https://example.com*" required>
                                        <div class="ui-form-text">Use <code>*</code> as a trailing wildcard.</div>
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="ui-form-label">Username</label>
                                        <input type="text" class="ui-form-control ui-form-control-sm" name="username"
                                               required autocomplete="off">
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="ui-form-label">Password</label>
                                        <input type="password" class="ui-form-control ui-form-control-sm" name="password"
                                               required autocomplete="new-password">
                                    </div>
                                    <div class="md:col-span-2 flex items-end">
                                        <button type="submit" class="ui-btn ui-btn-success ui-btn-sm w-full">
                                            <i class="me-1" data-icon="check" aria-hidden="true"></i>Save
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/kairos.js}"></script>
</body>
</html>
