<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Policies - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>
        <div class="admin-content" id="main-content">
            <th:block th:replace="~{layout :: feedback}"></th:block>

            <div class="flex justify-between items-center mb-6">
                <h1 class="heading-md mb-0"><i class="me-2" data-icon="bell-ring" aria-hidden="true"></i>Notification Policies</h1>
                <a class="ui-btn ui-btn-primary ui-btn-sm" th:href="@{/admin/notification-policies/new}">
                    <i class="me-1" data-icon="plus" aria-hidden="true"></i>Add Policy
                </a>
            </div>

            <div class="ui-card">
                <div class="ui-card-header"><strong>Configured Policies</strong></div>
                <div class="ui-card-body p-0">
                    <div th:if="${#lists.size(policies) == 0}" class="p-4 text-muted">No notification policies configured.</div>
                    <div class="ui-table-responsive"><table class="ui-table ui-table-hover mb-0" th:unless="${#lists.size(policies) == 0}">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Provider</th>
                            <th>Events</th>
                            <th>Scope</th>
                            <th style="width: 130px;">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="policy : ${policies}">
                            <td th:text="${policy.name}">Name</td>
                            <td>
                                <span class="ui-badge tone-primary" th:text="${policy.provider.type}">TYPE</span>
                                <span class="ms-1 text-muted" th:text="${policy.provider.name}">Provider</span>
                            </td>
                            <td>
                                <span th:if="${policy.notifyOnOutageStarted}" class="ui-badge tone-danger me-1">Outage Started</span>
                                <span th:if="${policy.notifyOnOutageEnded}" class="ui-badge tone-success me-1">Outage Resolved</span>
                                <span th:if="${!policy.notifyOnOutageStarted and !policy.notifyOnOutageEnded}" class="text-muted italic">none</span>
                            </td>
                            <td>
                                <span th:if="${policy.scopeType.name == 'ALL'}" class="ui-badge tone-secondary">All Resources</span>
                                <span th:if="${policy.scopeType.name == 'SCOPED'}" class="ui-badge tone-warning text-ink">Scoped</span>
                            </td>
                            <td>
                                <a class="ui-btn ui-btn-outline-secondary ui-btn-sm" th:href="@{/admin/notification-policies/edit/{id}(id=${policy.id})}">
                                    <i class="" data-icon="pencil" aria-hidden="true"></i>
                                </a>
                                <form th:action="@{/admin/notification-policies/delete/{id}(id=${policy.id})}" method="post" class="inline"
                                      onsubmit="return confirm('Delete this notification policy?')">
                                    <button type="submit" class="ui-btn ui-btn-danger ui-btn-sm" aria-label="Delete"><i class="" data-icon="trash-2" aria-hidden="true"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/kairos.js}"></script>
</body>
</html>
