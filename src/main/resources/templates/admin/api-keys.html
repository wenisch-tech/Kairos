<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Keys - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>
        <div class="admin-content" id="main-content">
            <th:block th:replace="~{layout :: feedback}"></th:block>

            <div th:if="${newApiKeyToken}" class="ui-alert ui-alert-warning">
                <h6 class="font-semibold mb-2"><i class="me-1" data-icon="shield-check" aria-hidden="true"></i>Copy this API key now</h6>
                <p class="mb-2">This token is shown only once and cannot be retrieved again after you leave this page.</p>
                <div class="ui-input-group">
                    <input id="new-api-key-token" type="text" class="ui-form-control font-mono" th:value="${newApiKeyToken}" readonly>
                    <button type="button" class="ui-btn ui-btn-outline-light" onclick="copyApiKeyToken()">
                        <i class="me-1" data-icon="clipboard" aria-hidden="true"></i>Copy
                    </button>
                </div>
            </div>

            <div class="flex justify-between items-center mb-6">
                <h1 class="heading-md mb-0"><i class="me-2" data-icon="key-round" aria-hidden="true"></i>API Key Management</h1>
            </div>

            <div class="ui-card mb-6">
                <div class="ui-card-body">
                    <h5 class="ui-card-title">Create API key</h5>
                    <form th:action="@{/admin/api-keys/add}" method="post" class="ui-grid gap-4 items-end">
                        <div class="md:col-span-8">
                            <label class="ui-form-label">Name</label>
                            <input type="text" class="ui-form-control" name="name" maxlength="120" placeholder="e.g. CI Deploy Token" required>
                        </div>
                        <div class="md:col-span-4">
                            <button type="submit" class="ui-btn ui-btn-primary w-full">
                                <i class="me-1" data-icon="circle-plus" aria-hidden="true"></i>Create API Key
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="ui-card">
                <div class="ui-card-body p-0">
                    <div th:if="${#lists.size(apiKeys) == 0}" class="p-4 text-muted">No API keys configured.</div>
                    <div class="ui-table-responsive"><table class="ui-table ui-table-hover mb-0" th:unless="${#lists.size(apiKeys) == 0}">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Created By</th>
                            <th>Created</th>
                            <th>Key ID</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="apiKey : ${apiKeys}">
                            <td th:text="${apiKey.name}">Name</td>
                            <td th:text="${apiKey.createdBy}">creator</td>
                            <td th:text="${apiKey.createdAt != null} ? ${@kairosTime.format(apiKey.createdAt, 'yyyy-MM-dd HH:mm')} : '-'">date</td>
                            <td><code th:text="${apiKey.keyId}">id</code></td>
                            <td>
                                <form th:action="@{/admin/api-keys/delete/{id}(id=${apiKey.id})}" method="post" class="inline"
                                      onsubmit="return confirm('Delete this API key? Clients using it will lose access immediately.')">
                                    <button type="submit" class="ui-btn ui-btn-danger ui-btn-sm" aria-label="Delete">
                                        <i class="" data-icon="trash-2" aria-hidden="true"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/kairos.js}"></script>
<script>
    function copyApiKeyToken() {
        const input = document.getElementById('new-api-key-token');
        if (!input) {
            return;
        }
        input.select();
        input.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(input.value);
    }
</script>
</body>
</html>
