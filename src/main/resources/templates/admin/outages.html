<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outages - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>
        <div class="admin-content" id="main-content">
            <th:block th:replace="~{layout :: feedback}"></th:block>

            <div class="flex justify-between items-center mb-4">
                <h1 class="heading-md mb-0"><i class="me-2" data-icon="octagon-alert" aria-hidden="true"></i>Outages</h1>
                <small class="text-muted" th:text="${#lists.size(outages)} + ' shown (max 500)'">0 shown</small>
            </div>

            <div class="ui-card mb-6">
                <div class="ui-card-header"><i class="me-2" data-icon="list-filter" aria-hidden="true"></i>Filters</div>
                <div class="ui-card-body">
                    <form method="get" th:action="@{/admin/outages}" class="ui-grid gap-4 items-end">
                        <div class="md:col-span-3">
                            <label for="status" class="ui-form-label">Status</label>
                            <select id="status" name="status" class="ui-form-select">
                                <option value="all" th:selected="${selectedStatus == 'all'}">All</option>
                                <option value="active" th:selected="${selectedStatus == 'active'}">Active</option>
                                <option value="resolved" th:selected="${selectedStatus == 'resolved'}">Resolved</option>
                            </select>
                        </div>
                        <div class="md:col-span-5">
                            <label for="q" class="ui-form-label">Search</label>
                            <input id="q" type="text" name="q" class="ui-form-control" placeholder="Outage ID or resource name"
                                   th:value="${searchQuery}">
                        </div>
                        <div class="md:col-span-4 flex gap-2">
                            <button type="submit" class="ui-btn ui-btn-primary"><i class="me-1" data-icon="search" aria-hidden="true"></i>Apply</button>
                            <a th:href="@{/admin/outages}" class="ui-btn ui-btn-outline-secondary">Reset</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="ui-card mb-6">
                <div class="ui-card-header flex justify-between items-center">
                    <span><i class="me-2" data-icon="trash-2" aria-hidden="true"></i>Manual Cleanup</span>
                    <form method="post" th:action="@{/admin/outages/delete-resolved}"
                          onsubmit="return confirm('Delete all resolved outages? This cannot be undone.');">
                        <input type="hidden" name="status" th:value="${selectedStatus}">
                        <input type="hidden" name="q" th:value="${searchQuery}">
                        <button type="submit" class="ui-btn ui-btn-sm ui-btn-outline-danger">
                            <i class="me-1" data-icon="trash-2" aria-hidden="true"></i>Delete All Resolved
                        </button>
                    </form>
                </div>
                <div class="ui-card-body p-0">
                    <div th:if="${#lists.size(outages) == 0}" class="p-4 text-muted">No outages match the selected filters.</div>

                    <form th:unless="${#lists.size(outages) == 0}" method="post" th:action="@{/admin/outages/delete-selected}"
                          onsubmit="return confirm('Delete selected outages? This cannot be undone.');">
                        <input type="hidden" name="status" th:value="${selectedStatus}">
                        <input type="hidden" name="q" th:value="${searchQuery}">
                        <div class="ui-table-responsive">
                            <div class="ui-table-responsive"><table class="ui-table ui-table-sm ui-table-hover align-middle mb-0">
                                <thead>
                                <tr>
                                    <th style="width: 40px;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                                    <th>ID</th>
                                    <th>Resource</th>
                                    <th>Status</th>
                                    <th>Start</th>
                                    <th>End</th>
                                    <th style="width: 90px;"></th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="outage : ${outages}">
                                    <td><input class="ui-form-check-input outage-checkbox" type="checkbox" name="outageIds" th:value="${outage.id}"></td>
                                    <td th:text="${outage.id}">1</td>
                                    <td>
                                        <span th:if="${outage.resource != null}" th:text="${outage.resource.name}">Resource</span>
                                        <span th:unless="${outage.resource != null}" class="text-muted italic">Deleted resource</span>
                                    </td>
                                    <td>
                                        <span th:if="${outage.active}" class="ui-badge tone-danger">Active</span>
                                        <span th:unless="${outage.active}" class="ui-badge tone-success">Resolved</span>
                                    </td>
                                    <td th:text="${@kairosTime.format(outage.startDate, 'yyyy-MM-dd HH:mm:ss')}">-</td>
                                    <td>
                                        <span th:if="${outage.endDate != null}" th:text="${@kairosTime.format(outage.endDate, 'yyyy-MM-dd HH:mm:ss')}">-</span>
                                        <span th:unless="${outage.endDate != null}" class="text-muted italic">ongoing</span>
                                    </td>
                                    <td class="text-center">
                                        <button type="submit"
                                                class="ui-btn ui-btn-sm ui-btn-outline-danger"
                                                title="Delete outage"
                                                th:formaction="@{/admin/outages/delete/{id}(id=${outage.id})}"
                                                formmethod="post"
                                                onclick="return confirm('Delete this outage? This cannot be undone.');">
                                            <i class="" data-icon="trash-2" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                                </tbody>
                            </table></div>
                        </div>

                        <div class="p-4 border-top flex justify-between items-center">
                            <small class="text-muted">Tip: select one or more outages and use bulk delete.</small>
                            <button type="submit" class="ui-btn ui-btn-danger">
                                <i class="me-1" data-icon="trash-2" aria-hidden="true"></i>Delete Selected
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/kairos.js}"></script>
<script>
    function toggleSelectAll(toggle) {
        document.querySelectorAll('.outage-checkbox').forEach(function (cb) {
            cb.checked = toggle.checked;
        });
    }
</script>
</body>
</html>
