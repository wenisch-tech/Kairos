<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Kairos Admin'">Announcement - Kairos Admin</title>
    <link rel="stylesheet" th:href="@{/css/editor.css}">
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>

        <div class="admin-content" id="main-content">
            <div class="flex justify-between items-center mb-6">
                <h1 class="heading-md mb-0"><i class="me-2" data-icon="megaphone" aria-hidden="true"></i><span th:text="${pageTitle}">Create Announcement</span></h1>
                <a th:href="@{/admin/announcements}" class="ui-btn ui-btn-outline-secondary">Back</a>
            </div>

            <div class="ui-card">
                <div class="ui-card-body">
                    <form th:action="@{${formAction}}" method="post" id="announcementForm">
                        <div class="ui-grid gap-4">
                            <div class="md:col-span-4">
                                <label class="ui-form-label">Type</label>
                                <select class="ui-form-select" name="kind" required>
                                    <option th:each="kind : ${announcementKinds}" th:value="${kind}"
                                            th:selected="${kind == announcement.kind}" th:text="${kind}">INFORMATION</option>
                                </select>
                            </div>
                            <div class="md:col-span-4 flex items-end">
                                <div class="ui-form-check ui-form-switch mb-2">
                                    <input class="ui-form-check-input" type="checkbox" id="active" name="active"
                                           th:checked="${announcement.active}">
                                    <label class="ui-form-check-label" for="active">Active</label>
                                </div>
                            </div>
                            <div class="md:col-span-4">
                                <label class="ui-form-label">Active Until (optional)</label>
                                <input type="datetime-local" class="ui-form-control" name="activeUntil"
                                       th:value="${announcement.activeUntil != null} ? ${@kairosTime.format(announcement.activeUntil, 'yyyy-MM-dd''T''HH:mm')} : ''">
                            </div>
                            <div class="col-span-12">
                                <label class="ui-form-label">Content</label>
                                <div id="editor" class="quill-editor"></div>
                                <input type="hidden" id="content" name="content">
                                <div class="ui-form-text">Supports formatted text, links, and paste from clipboard.</div>
                                <div class="mt-4 flex gap-2">
                                    <button type="submit" class="ui-btn ui-btn-primary">
                                        <i class="me-1" data-icon="circle-check" aria-hidden="true"></i>Save Announcement
                                    </button>
                                    <a th:href="@{/admin/announcements}" class="ui-btn ui-btn-secondary">Cancel</a>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/editor.js}"></script>
<script th:src="@{/js/kairos.js}"></script>
<script th:inline="javascript">
    const initialContent = /*[[${announcement.content}]]*/ '';

    const quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline'],
                [{ 'list': 'ordered' }, { 'list': 'bullet' }],
                ['link'],
                ['clean']
            ]
        }
    });

    if (initialContent) {
        quill.clipboard.dangerouslyPasteHTML(initialContent);
    }

    document.getElementById('announcementForm').addEventListener('submit', function (event) {
        const html = quill.getSemanticHTML().trim();
        const emptyHtml = '<p><br></p>';
        if (!html || html === emptyHtml) {
            event.preventDefault();
            alert('Announcement content is required.');
            return;
        }
        document.getElementById('content').value = html;
    });
</script>
</body>
</html>
