<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>

        <div class="admin-content" id="main-content">
            <th:block th:replace="~{layout :: feedback}"></th:block>

            <div class="flex justify-between items-center mb-6">
                <h1 class="heading-md mb-0"><i class="me-2" data-icon="megaphone" aria-hidden="true"></i>Announcements</h1>
                <a th:href="@{/admin/announcements/new}" class="ui-btn ui-btn-primary">
                    <i class="me-1" data-icon="circle-plus" aria-hidden="true"></i>Create Announcement
                </a>
            </div>

            <div class="ui-card">
                <div class="ui-card-body p-0">
                    <div th:if="${#lists.size(announcements) == 0}" class="p-4">
                        <p class="text-muted mb-4">No announcements configured.</p>
                        <a th:href="@{/admin/announcements/new}" class="ui-btn ui-btn-primary ui-btn-sm">
                            <i class="me-1" data-icon="circle-plus" aria-hidden="true"></i>Create your first announcement
                        </a>
                    </div>
                    <div class="ui-table-responsive"><table class="ui-table ui-table-hover mb-0" th:unless="${#lists.size(announcements) == 0}">
                        <thead>
                        <tr>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Active Until</th>
                            <th>Created By</th>
                            <th>Created At</th>
                            <th style="width: 45%">Preview</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="announcement : ${announcements}">
                            <td>
                                <span class="ui-badge"
                                      th:classappend="${announcement.kind.name == 'INFORMATION'} ? 'tone-info text-ink' : (${announcement.kind.name == 'WARNING'} ? 'tone-warning text-ink' : 'tone-danger')"
                                      th:text="${announcement.kind}">INFORMATION</span>
                            </td>
                            <td>
                                <span th:if="${announcement.active}" class="ui-badge tone-success">Active</span>
                                <span th:unless="${announcement.active}" class="ui-badge tone-secondary">Inactive</span>
                            </td>
                            <td th:text="${announcement.activeUntil != null} ? ${@kairosTime.format(announcement.activeUntil, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                            <td th:text="${announcement.createdBy != null && !#strings.isEmpty(announcement.createdBy)} ? ${announcement.createdBy} : 'Unknown'">Unknown</td>
                            <td th:text="${announcement.createdAt != null} ? ${@kairosTime.format(announcement.createdAt, 'yyyy-MM-dd HH:mm')} : '-'">-</td>
                            <td>
                                <div class="announcement-content-preview" th:utext="${announcement.content}"></div>
                            </td>
                            <td>
                                <a th:href="@{/admin/announcements/edit/{id}(id=${announcement.id})}" class="ui-btn ui-btn-outline-primary ui-btn-sm">
                                    <i class="" data-icon="pencil" aria-hidden="true"></i>
                                </a>
                                <form th:action="@{/admin/announcements/delete/{id}(id=${announcement.id})}" method="post" class="inline"
                                      onsubmit="return confirm('Delete this announcement?')">
                                    <button type="submit" class="ui-btn ui-btn-danger ui-btn-sm" aria-label="Delete">
                                        <i class="" data-icon="trash-2" aria-hidden="true"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/kairos.js}"></script>
</body>
</html>
