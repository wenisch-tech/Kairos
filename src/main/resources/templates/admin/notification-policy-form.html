<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Edit Notification Policy' : 'New Notification Policy'">Notification Policy - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
    <style>
        .scope-item { cursor: pointer; }
        .scope-item:hover { background-color: rgba(255,255,255,.05); }
        #scopePanel { min-height: 200px; max-height: 320px; overflow-y: auto; }
        #selectedPanel { min-height: 200px; max-height: 320px; overflow-y: auto; }
    </style>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>
        <div class="admin-content" id="main-content">
            <div class="flex justify-between items-center mb-6">
                <h1 class="heading-md mb-0">
                    <i class="me-2" data-icon="bell-ring" aria-hidden="true"></i>
                    <span th:text="${editMode} ? 'Edit Notification Policy' : 'New Notification Policy'">Notification Policy</span>
                </h1>
                <a class="ui-btn ui-btn-outline-secondary" th:href="@{/admin/notification-policies}">
                    <i class="me-1" data-icon="arrow-left" aria-hidden="true"></i>Back
                </a>
            </div>

            <div class="ui-card">
                <div class="ui-card-body">
                    <form th:action="${editMode} ? @{/admin/notification-policies/edit/{id}(id=${policy.id})} : @{/admin/notification-policies/new}"
                          method="post" id="policyForm">

                        <div class="mb-4">
                            <label class="ui-form-label font-semibold">Name</label>
                            <input type="text" class="ui-form-control" name="name" required maxlength="255"
                                   th:value="${policy.name}" placeholder="e.g. Critical Alerts">
                        </div>

                        <div class="mb-6">
                            <label class="ui-form-label font-semibold">Notification Provider</label>
                            <select class="ui-form-select" name="providerId" required>
                                <option value="" disabled th:unless="${editMode}">-- Select a provider --</option>
                                <option th:each="p : ${providers}"
                                        th:value="${p.id}"
                                        th:selected="${editMode and policy.provider != null and policy.provider.id == p.id}"
                                        th:text="${p.name + ' (' + p.type + ')'}">Provider</option>
                            </select>
                        </div>

                        <div class="mb-6">
                            <label class="ui-form-label font-semibold">Notify on Events</label>
                            <div class="ui-form-check">
                                <input class="ui-form-check-input" type="checkbox" id="notifyOutageStarted"
                                       name="notifyOnOutageStarted" value="true"
                                       th:checked="${policy.notifyOnOutageStarted}">
                                <label class="ui-form-check-label" for="notifyOutageStarted">
                                    <span class="ui-badge tone-danger me-1">Outage Started</span>
                                    Notify when a resource goes down
                                </label>
                            </div>
                            <div class="ui-form-check mt-2">
                                <input class="ui-form-check-input" type="checkbox" id="notifyOutageEnded"
                                       name="notifyOnOutageEnded" value="true"
                                       th:checked="${policy.notifyOnOutageEnded}">
                                <label class="ui-form-check-label" for="notifyOutageEnded">
                                    <span class="ui-badge tone-success me-1">Outage Resolved</span>
                                    Notify when a resource recovers
                                </label>
                            </div>
                        </div>

                        <div class="mb-6">
                            <label class="ui-form-label font-semibold">Scope</label>
                            <div class="mb-2">
                                <div class="ui-form-check ui-form-check-inline">
                                    <input class="ui-form-check-input" type="radio" name="scopeType" id="scopeAll"
                                           value="ALL" onchange="updateScopePanel()"
                                           th:checked="${policy.scopeType == null or policy.scopeType.name == 'ALL'}">
                                    <label class="ui-form-check-label" for="scopeAll">All Resources</label>
                                </div>
                                <div class="ui-form-check ui-form-check-inline">
                                    <input class="ui-form-check-input" type="radio" name="scopeType" id="scopeScoped"
                                           value="SCOPED" onchange="updateScopePanel()"
                                           th:checked="${policy.scopeType != null and policy.scopeType.name == 'SCOPED'}">
                                    <label class="ui-form-check-label" for="scopeScoped">Scoped (specific groups/resources)</label>
                                </div>
                            </div>

                            <div id="scopePickerPanel" style="display:none;">
                                <div class="ui-grid gap-4">
                                    <div class="md:col-span-6">
                                        <div class="ui-card h-full">
                                            <div class="ui-card-header flex items-center gap-2">
                                                <strong>Available</strong>
                                                <input type="text" class="ui-form-control ui-form-control-sm ms-auto" id="scopeSearch"
                                                       placeholder="Search..." oninput="filterScope(this.value)" style="max-width:160px;">
                                            </div>
                                            <div class="ui-card-body p-1" id="scopePanel">
                                                <!-- Groups -->
                                                <div th:each="group : ${allGroups}"
                                                     class="scope-item flex items-center px-2 py-1 rounded mb-1"
                                                     th:data-id="${group.id}"
                                                     th:data-kind="group"
                                                     th:data-label="${group.name}"
                                                     onclick="addScopeItem(this)">
                                                    <span class="ui-badge tone-secondary me-2">Group</span>
                                                    <span th:text="${group.name}">Group</span>
                                                </div>
                                                <!-- Resources -->
                                                <div th:each="resource : ${allResources}"
                                                     class="scope-item flex items-center px-2 py-1 rounded mb-1"
                                                     th:data-id="${resource.id}"
                                                     th:data-kind="resource"
                                                     th:data-label="${resource.name}"
                                                     onclick="addScopeItem(this)">
                                                    <span class="ui-badge tone-primary me-2" th:text="${resource.resourceType}">TYPE</span>
                                                    <span th:text="${resource.name}">Resource</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="md:col-span-6">
                                        <div class="ui-card h-full">
                                            <div class="ui-card-header"><strong>Selected Scope</strong></div>
                                            <div class="ui-card-body p-1" id="selectedPanel">
                                                <div id="emptyHint" class="text-muted px-2 py-1 italic">Click items on the left to add them.</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Hidden inputs for selected scope items -->
                        <div id="hiddenScopeInputs"></div>

                        <div class="flex gap-2">
                            <button type="submit" class="ui-btn ui-btn-primary">
                                <i class="me-1" data-icon="save" aria-hidden="true"></i>Save
                            </button>
                            <a class="ui-btn ui-btn-outline-secondary" th:href="@{/admin/notification-policies}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/kairos.js}"></script>
<script th:inline="javascript">
    // Pre-seeded selections from server (edit mode)
    const preselectedGroups    = /*[[${policy.scopedGroups != null ? policy.scopedGroups.![id] : {}}]]*/ [];
    const preselectedResources = /*[[${policy.scopedResources != null ? policy.scopedResources.![id] : {}}]]*/ [];

    // Track selected items: key = "group-{id}" or "resource-{id}"
    const selected = new Map();

    function updateScopePanel() {
        const scoped = document.getElementById('scopeScoped').checked;
        document.getElementById('scopePickerPanel').style.display = scoped ? '' : 'none';
    }

    function filterScope(query) {
        const q = query.toLowerCase();
        document.querySelectorAll('#scopePanel .scope-item').forEach(el => {
            const label = el.dataset.label || '';
            el.style.display = label.toLowerCase().includes(q) ? '' : 'none';
        });
    }

    function addScopeItem(el) {
        const id   = el.dataset.id;
        const kind = el.dataset.kind;
        const key  = kind + '-' + id;
        if (selected.has(key)) return;
        selected.set(key, { id, kind, label: el.dataset.label });
        el.style.display = 'none';
        renderSelected();
        rebuildHiddenInputs();
    }

    function removeScopeItem(key) {
        const item = selected.get(key);
        selected.delete(key);
        // Show the item back in the available panel
        document.querySelectorAll('#scopePanel .scope-item').forEach(el => {
            if (el.dataset.kind === item.kind && el.dataset.id === String(item.id)) {
                el.style.display = '';
            }
        });
        renderSelected();
        rebuildHiddenInputs();
    }

    function renderSelected() {
        const panel = document.getElementById('selectedPanel');
        const hint  = document.getElementById('emptyHint');
        // Remove previous rendered items (not the hint)
        panel.querySelectorAll('.selected-item').forEach(n => n.remove());

        if (selected.size === 0) {
            hint.style.display = '';
            return;
        }
        hint.style.display = 'none';
        selected.forEach((item, key) => {
            const div = document.createElement('div');
            div.className = 'selected-item flex items-center px-2 py-1 rounded mb-1 justify-between';
            const badgeClass = item.kind === 'group' ? 'tone-secondary' : 'tone-primary';
            const kindLabel  = item.kind === 'group' ? 'Group' : item.kind.toUpperCase().replace('-','');
            div.innerHTML = `<div><span class="ui-badge ${badgeClass} me-2">${item.kind === 'group' ? 'Group' : kindLabel}</span><span>${item.label}</span></div>
                             <button type="button" class="ui-btn ui-btn-sm ui-btn-outline-danger py-0 px-1" onclick="removeScopeItem('${key}')" aria-label="Close"><i class="" data-icon="x" aria-hidden="true"></i></button>`;
            panel.appendChild(div);
            window.KairosUI.icons();
        });
    }

    function rebuildHiddenInputs() {
        const container = document.getElementById('hiddenScopeInputs');
        container.innerHTML = '';
        selected.forEach((item) => {
            const input = document.createElement('input');
            input.type  = 'hidden';
            input.name  = item.kind === 'group' ? 'scopedGroupIds' : 'scopedResourceIds';
            input.value = item.id;
            container.appendChild(input);
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        updateScopePanel();

        // Pre-select items in edit mode
        preselectedGroups.forEach(id => {
            const el = document.querySelector('#scopePanel .scope-item[data-kind="group"][data-id="' + id + '"]');
            if (el) addScopeItem(el);
        });
        preselectedResources.forEach(id => {
            const el = document.querySelector('#scopePanel .scope-item[data-kind="resource"][data-id="' + id + '"]');
            if (el) addScopeItem(el);
        });
    });
</script>
</body>
</html>
