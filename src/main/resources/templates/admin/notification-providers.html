<!DOCTYPE html>
<html lang="en" data-theme="light"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notification Providers - Kairos Admin</title>
    <th:block th:replace="~{layout :: assets}"></th:block>
    <th:block th:utext="${customHeadersHtml}"></th:block>
</head>
<body class="admin-page" x-data="{ navOpen: false }">
<nav th:replace="~{admin/layout :: adminNavbar}"></nav>

<div class="admin-shell">
    <div class="admin-frame">
        <aside th:replace="~{admin/layout :: adminSidebar}"></aside>
        <div class="admin-content" id="main-content">
            <th:block th:replace="~{layout :: feedback}"></th:block>

            <div class="flex justify-between items-center mb-6">
                <h1 class="heading-md mb-0"><i class="me-2" data-icon="bell" aria-hidden="true"></i>Notification Providers</h1>
                <a class="ui-btn ui-btn-primary ui-btn-sm" th:href="@{/admin/notification-providers/new}">
                    <i class="me-1" data-icon="plus" aria-hidden="true"></i>Add Provider
                </a>
            </div>

            <div class="ui-card">
                <div class="ui-card-header"><strong>Configured Providers</strong></div>
                <div class="ui-card-body p-0">
                    <div th:if="${#lists.size(providers) == 0}" class="p-4 text-muted">No notification providers configured.</div>
                    <div class="ui-table-responsive"><table class="ui-table ui-table-hover mb-0" th:unless="${#lists.size(providers) == 0}">
                        <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th style="width: 240px;">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="provider : ${providers}">
                            <td th:text="${provider.name}">Name</td>
                            <td>
                                <span class="ui-badge tone-primary" th:text="${provider.type}">TYPE</span>
                            </td>
                            <td>
                                <a class="ui-btn ui-btn-outline-secondary ui-btn-sm" th:href="@{/admin/notification-providers/edit/{id}(id=${provider.id})}">
                                    <i class="" data-icon="pencil" aria-hidden="true"></i>
                                </a>
                                <form th:action="@{/admin/notification-providers/{id}/test(id=${provider.id})}" method="post" class="inline">
                                    <button type="submit" class="ui-btn ui-btn-outline-info ui-btn-sm" title="Send test notification">
                                        <i class="" data-icon="send" aria-hidden="true"></i>
                                    </button>
                                </form>
                                <form th:action="@{/admin/notification-providers/delete/{id}(id=${provider.id})}" method="post" class="inline"
                                      onsubmit="return confirm('Delete this provider and all its associated notification policies?')">
                                    <button type="submit" class="ui-btn ui-btn-danger ui-btn-sm" aria-label="Delete"><i class="" data-icon="trash-2" aria-hidden="true"></i></button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/kairos.js}"></script>
</body>
</html>
