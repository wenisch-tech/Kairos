replicaCount: 1
image:
  registry: ghcr.io
  repository: wenisch-tech/kairos
  tag: 2.20.10
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Leave empty to derive the strategy from `persistence.enabled`:
# Recreate with persistence (the embedded H2 file store allows a single writer only),
# RollingUpdate otherwise. Set explicitly to override, e.g. when using PostgreSQL.
updateStrategy: {}
# Give the JVM time to drain requests and close the datasource before SIGKILL.
terminationGracePeriodSeconds: 60
nameOverride: ""
fullnameOverride: ""
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532
autoscaling:
  enabled: false
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}
metrics:
  path: /actuator/prometheus
  serviceAnnotations:
    enabled: true
  podAnnotations:
    enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
    honorLabels: false
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kairos.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 1000m
    memory: 2Gi
  limits:
    cpu: 2000m
    memory: 4Gi
persistence:
  enabled: false
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /app/data
nodeSelector: {}
tolerations: []
affinity: {}
# Environment variables for Spring Boot and application configuration

# Leave empty to use defaults
env:
  # Database configuration
  SPRING_DATASOURCE_URL: ""
  SPRING_DATASOURCE_USERNAME: ""
  SPRING_DATASOURCE_PASSWORD: ""
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.H2Dialect"
  # Session cookie configuration required for cross-site OIDC redirects
  SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: "none"
  SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
  # Honor HTTPS and host headers sent by a TLS-terminating reverse proxy or ingress.
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"
  # OIDC / OAuth2 configuration
  OIDC_ENABLED: "false"
  OIDC_CREATEUSERS: "true"
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_ISSUER_URI: ""
  OIDC_IGNORE_TLS: "false"
  # Docker socket configuration (if accessing Docker from container)
  DOCKER_HOST: ""
  # Optional: Custom Spring Boot properties
# SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"

# LOGGING_LEVEL_ROOT: "INFO"

# Secrets for sensitive data
# If a key is set in both `env` and `secrets`, the Secret-backed value wins.
# You can still set sensitive values directly via `env` when you explicitly want that.
secrets: {}
# SPRING_DATASOURCE_PASSWORD: "your-password"

# OIDC_CLIENT_SECRET: "your-secret"
livenessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/liveness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3
readinessProbe:
  enabled: true
  httpGet:
    path: /actuator/health/readiness
    port: http
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 5
startupProbe:
  enabled: true
  httpGet:
    path: /actuator/health
    port: http
  # Allow slower boots (migrations, cold starts) before liveness kicks in.

  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 30
